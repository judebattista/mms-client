# Build the offline .deb (PLT-5), verify it on clean Ubuntu LTS and Kali containers with networking
# off, and attach it to the GitHub release when a version tag is pushed. See docs/packaging.md.
name: package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)"
          [ "${GITHUB_REF_NAME#v}" = "$version" ] || { echo "tag $GITHUB_REF_NAME != pyproject version $version"; exit 1; }
      - name: Lint and unit/integration tests (development install)
        run: |
          uv sync --frozen
          uv run ruff check src tests tools packaging
          uv run python -m pytest -q
      - name: Build the package
        run: packaging/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: |
            dist/*.deb
            dist/*.deb.sha256
          if-no-files-found: error

  verify:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "kalilinux/kali-rolling"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: dist
      - name: Install offline and test (${{ matrix.image }})
        run: packaging/verify-deb.sh dist/ied-client_*_amd64.deb "${{ matrix.image }}"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.deb.sha256
