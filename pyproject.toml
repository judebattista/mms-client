[project]
name = "mms-client"
version = "0.1.0"
description = "IEC 61850 MMS client for verifying and troubleshooting IEDs in a test rack"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    # The protocol stack. Pinned exactly: the adapter binds to symbols of the
    # libiec61850 build shipped inside this wheel (see docs/spikes.md).
    "pyiec61850-ng==1.6.1.10",
    "prompt_toolkit>=3.0.40",
    "rich>=13.7",
    "PyYAML>=6.0.1",
]

[project.scripts]
mms-client = "mms_client.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mms_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
markers = [
    "integration: needs the simulated IED (spawns a subprocess on localhost)",
    "soak: long-running memory soak test (RSK-5); run with -m soak",
]
addopts = "-m 'not soak'"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM105", "SIM108"]
